# Хостинг Netlify: автопубликация из GitHub, у каждой ветки своя тестовая ссылка.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# SPA: любой адрес (/studio, /host/…, /play/…, /screen/…, /j) отдаёт index.html.
# Существующие файлы (скрипты, стили, иконка) Netlify отдаёт раньше этого правила.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Шрифты и собранные чанки не меняются под тем же именем: телефон гостя
# кэширует их надолго и при повторном входе не качает заново.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
