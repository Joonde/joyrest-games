# Проверки → образ → выкладка. Запускается только на push (main и ветки claude/*):
# проверки PR идут по тому же коммиту, повторный прогон на pull_request не нужен —
# так экономим минуты Actions (закрытый репозиторий: 2000 минут в месяц).
name: Сборка

# main выкладывается на games.joy-rest.ru, ветки claude/* — на test.games.joy-rest.ru.
# Выкладка включается переменной репозитория DEPLOY_ENABLED=true (после настройки сервера).

on:
  push:
    branches: [main, "claude/**"]
  # Повторить сборку и выкладку вручную. Выложить основную версию во время игры (force) можно
  # только из Termius: sudo joyrest deploy <коммит> force.
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/joonde/joyrest-app

jobs:
  check:
    name: Тесты и проверки
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Проверка типов
        run: npx tsc -b
      - name: Тесты
        run: npm test
        env:
          TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres
      - name: Сборка платформы, сервера и сайта агентства
        run: npm run build && npm run build:server && npm run build:site
      - name: Проверка скриптов сервера (shellcheck)
        # Замечания — аннотациями (видно в итогах сборки с телефона, без чтения лога).
        run: |
          set -o pipefail
          shellcheck --severity=warning -f gcc deploy/bin/* deploy/setup/*.sh \
            | sed -E 's/^([^:]+):([0-9]+):[0-9]+: (.*)$/::error file=\1,line=\2::\3/'
      - name: Проверка docker-compose
        run: |
          printf 'APP_IMAGE=%s:ci\nAPP_TEST_IMAGE=%s:ci\n' "$IMAGE" "$IMAGE" > /tmp/runtime.env
          printf 'ADMIN_EMAIL=ci@example.com\nPOSTGRES_PASSWORD=ci\n' > /tmp/secrets.env
          docker compose -f deploy/compose.yml --env-file /tmp/secrets.env --env-file /tmp/runtime.env config -q
          # Наружу публикует порты только caddy (Docker обходит ufw).
          published=$(docker compose -f deploy/compose.yml --env-file /tmp/secrets.env --env-file /tmp/runtime.env config --format json \
            | jq -r '.services | to_entries[] | select(.value.ports != null and (.value.ports | length) > 0) | .key')
          echo "Сервисы с открытыми портами: $published"
          [ "$published" = "caddy" ]

  image:
    name: Образ в GHCR
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Теги
        id: tags
        run: |
          branch="${GITHUB_REF_NAME//\//-}"
          # Теги release / test-release ставит только задача «Выкладка» (при DEPLOY_ENABLED).
          case "${branch,,}" in release|test-release) echo "::error::Ветка с именем тега релиза"; exit 1 ;; esac
          echo "list=$IMAGE:sha-$GITHUB_SHA,$IMAGE:${branch,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          build-args: |
            APP_VERSION=${{ github.sha }}
            APP_IMAGE=${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Переключатель выкладки: переменная репозитория DEPLOY_ENABLED. Значение сравнивается с
  # true без учёта пробелов, \r\n и регистра (при вставке с телефона в поле попадает перевод
  # строки). Если выкладка выключена — в логе видно, что именно видит GitHub.
  switch:
    name: Переключатель выкладки
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: DEPLOY_ENABLED
        id: check
        env:
          VALUE: ${{ vars.DEPLOY_ENABLED }}
          AS_SECRET: ${{ secrets.DEPLOY_ENABLED != '' }}
        run: |
          # Убираем \r\n, невидимые символы (неразрывный пробел, нулевой ширины, BOM) и пробелы
          # по краям; пробел внутри слова не прощаем.
          clean=$(printf '%s' "$VALUE" | LC_ALL=C sed -e 's/\xc2\xa0/ /g; s/\xe2\x80[\x8b-\x8d]//g; s/\xef\xbb\xbf//g' \
            | tr -d '\r\n' | sed -e 's/^[[:space:]]*//; s/[[:space:]]*$//' | tr '[:upper:]' '[:lower:]')
          if [ "$clean" = true ]; then
            [ "$VALUE" = true ] || echo "Значение DEPLOY_ENABLED содержит лишние символы — они отброшены."
            echo "Выкладка включена."
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "enabled=false" >> "$GITHUB_OUTPUT"
          if [ -z "$VALUE" ]; then
            echo "Переменная репозитория DEPLOY_ENABLED не найдена (Settings → Secrets and variables → Actions → Variables)."
          else
            echo "Переменная DEPLOY_ENABLED не равна true. Значение по символам:"
            printf '%s' "$VALUE" | od -An -c
          fi
          if [ "$AS_SECRET" = true ]; then
            echo "Найден СЕКРЕТ DEPLOY_ENABLED: для выкладки нужна переменная (вкладка Variables), а не секрет."
          fi
          echo "::notice::Выкладка выключена: нужна переменная репозитория DEPLOY_ENABLED = true"
      - name: Пометка [no-test]
        if: github.ref != 'refs/heads/main' && contains(github.event.head_commit.message, '[no-test]')
        run: echo "::notice::В сообщении коммита [no-test] — выкладка на test.games.joy-rest.ru пропущена."

  # [no-test] в сообщении коммита ветки claude/* — на test не выкладываем (тестовое окружение
  # общее: сайт и платформа). Сборка, тесты и образ идут как обычно. main выкладывается всегда.
  deploy:
    name: Выкладка
    needs: [image, switch]
    if: >-
      needs.switch.outputs.enabled == 'true' &&
      (github.ref == 'refs/heads/main' || !contains(github.event.head_commit.message, '[no-test]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Окружение production (Settings → Environments) пускает только main: ключ основной выкладки
    # DEPLOY_SSH_KEY лежит только там. Ветки берут DEPLOY_SSH_KEY_TEST (привратник: только test).
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'test' }}
    permissions:
      contents: read
      packages: write
    concurrency:
      group: deploy-${{ github.ref == 'refs/heads/main' && 'prod' || 'test' }}
      cancel-in-progress: false
    env:
      SHA: ${{ github.sha }}
      SERVER: 217.114.13.92
    steps:
      - name: Куда выкладываем
        id: target
        run: |
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            # Основная версия — только по SSH: по тегу в GHCR сервер её не забирает.
            { echo "env=prod"; echo "host=games.joy-rest.ru"; echo "tag="
              echo "command=deploy $SHA"; } >> "$GITHUB_OUTPUT"
          else
            { echo "env=test"; echo "host=test.games.joy-rest.ru"; echo "tag=test-release"
              echo "command=deploy-test $SHA"; } >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Описание релиза в GHCR: тег release (test-release) указывает на образ коммита.
      # По нему сервер сам забирает версию, если SSH недоступен (таймер раз в 2 минуты).
      # Тег ставится только здесь и только при включённом переключателе (условие задачи выше,
      # повторено на шаге): без него таймер на сервере ничего нового не увидит.
      - name: Тег ${{ steps.target.outputs.tag }} в GHCR
        if: needs.switch.outputs.enabled == 'true' && steps.target.outputs.tag != ''
        run: docker buildx imagetools create --tag "$IMAGE:${{ steps.target.outputs.tag }}" "$IMAGE:sha-$SHA"

      - name: SSH-ключ выкладки
        id: key
        env:
          DEPLOY_SSH_KEY: ${{ github.ref == 'refs/heads/main' && secrets.DEPLOY_SSH_KEY || secrets.DEPLOY_SSH_KEY_TEST }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_KNOWN_HOSTS" ]; then
            echo "::warning::Нет ключа выкладки (main — DEPLOY_SSH_KEY в окружении production, ветки — DEPLOY_SSH_KEY_TEST) или DEPLOY_KNOWN_HOSTS"
            echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          install -d -m 700 ~/.ssh
          # Секреты — hex одной строкой (так их удобно копировать с телефона); пробелы и
          # переводы строк, если Termius их добавил при копировании, убираем.
          printf '%s' "$DEPLOY_SSH_KEY"     | tr -d ' \r\n' | xxd -r -p > ~/.ssh/deploy_key
          printf '%s' "$DEPLOY_KNOWN_HOSTS" | tr -d ' \r\n' | xxd -r -p > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null \
            || { echo "::error::DEPLOY_SSH_KEY не читается — скопирован не целиком?"; exit 1; }
          grep -q '^217\.114\.13\.92 ssh-ed25519 ' ~/.ssh/known_hosts \
            || { echo "::error::DEPLOY_KNOWN_HOSTS не похож на ключ сервера"; exit 1; }
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Выкладка по SSH
        id: ssh
        if: steps.key.outputs.ready == 'true'
        continue-on-error: true
        env:
          COMMAND: ${{ steps.target.outputs.command }}
        run: |
          ssh_gate() {
            ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=15 -o ServerAliveInterval=10 "deploy@$SERVER" "$1"
          }
          for attempt in 1 2 3; do
            if ssh_gate ping && ssh_gate "$COMMAND"; then exit 0; fi
            echo "Попытка $attempt по SSH не удалась"
            sleep $((attempt * 10))
          done
          echo "::warning::SSH недоступен${{ steps.target.outputs.tag != '' && format(' — сервер заберёт релиз сам по тегу {0}', steps.target.outputs.tag) || ' — основную версию выложите из Termius: sudo joyrest deploy <коммит>' }}"
          exit 1

      # Итог проверяем по HTTPS одинаково для обоих путей: /health должен показать новую версию.
      - name: Проверка /health
        id: health
        env:
          HOST: ${{ steps.target.outputs.host }}
        run: |
          deadline=$((SECONDS + 600))
          while [ "$SECONDS" -lt "$deadline" ]; do
            body=$(curl -fsS --max-time 10 "https://$HOST/health" 2>/dev/null || true)
            if [ "$(echo "$body" | jq -r '.version // empty' 2>/dev/null)" = "$SHA" ] \
               && [ "$(echo "$body" | jq -r '.ok' 2>/dev/null)" = true ]; then
              echo "Выложено: $body"; exit 0
            fi
            sleep 10
          done
          echo "::error::За 10 минут https://$HOST/health не показал версию $SHA (последний ответ: ${body:-нет})"
          exit 1

      - name: Состояние выкладки на сервере
        id: status
        if: failure() && steps.key.outputs.ready == 'true'
        run: |
          status=$(ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 "deploy@$SERVER" status 2>/dev/null \
            | grep "^${{ steps.target.outputs.env }}:" || echo "сервер недоступен по SSH")
          echo "$status"
          { echo "text<<EOF"; echo "$status"; echo "EOF"; } >> "$GITHUB_OUTPUT"

      - name: Сообщение в Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HOST: ${{ steps.target.outputs.host }}
          HEALTH: ${{ steps.health.outcome }}
          SSH: ${{ steps.ssh.outcome }}
          STATUS: ${{ steps.status.outputs.text }}
          TITLE: ${{ github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Секреты, вставленные с телефона, могут содержать пробелы и \r\n — убираем.
          scrub() { printf '%s' "$1" | LC_ALL=C sed -e 's/\xc2\xa0//g; s/\xe2\x80[\x8b-\x8d]//g; s/\xef\xbb\xbf//g' | tr -d '[:space:]'; }
          token=$(scrub "$TELEGRAM_BOT_TOKEN")
          chat=$(scrub "$TELEGRAM_CHAT_ID")
          # Очищенный токен может отличаться от секрета — маскируем его в логе отдельно.
          [ -n "$token" ] && echo "::add-mask::$token"
          if [ -z "$token" ] || [ -z "$chat" ]; then
            echo "Telegram не настроен: нет секрета TELEGRAM_BOT_TOKEN или TELEGRAM_CHAT_ID"; exit 0
          fi
          if ! [[ "$token" =~ ^[0-9]+:[A-Za-z0-9_-]{30,}$ ]]; then
            echo "::warning::Telegram: TELEGRAM_BOT_TOKEN не похож на токен бота (ожидается «число:строка» от @BotFather)"; exit 0
          fi
          if ! [[ "$chat" =~ ^-?[0-9]+$ || "$chat" =~ ^@[A-Za-z0-9_]{5,}$ ]]; then
            echo "::warning::Telegram: TELEGRAM_CHAT_ID должен быть числом (например 123456789 или -100…) — сейчас «$chat»"; exit 0
          fi

          title=$(printf '%s' "$TITLE" | head -n 1 | cut -c1-80)
          if [ "$HEALTH" = success ]; then
            way=$([ "$SSH" = success ] && echo "по SSH" || echo "сервер забрал сам")
            text="✅ Выложено на $HOST: ${SHA:0:7} «$title» ($way)"
          else
            text="❌ Не выложено на $HOST: ${SHA:0:7} «$title»
          ${STATUS:-Сервер не подтвердил новую версию за 10 минут}
          $RUN_URL"
          fi

          # Адрес с токеном передаётся curl через файл настроек, а не аргументом.
          printf 'url = "https://api.telegram.org/bot%s/sendMessage"\n' "$token" > "$RUNNER_TEMP/tg.cfg"
          code=$(curl -sS --max-time 15 -K "$RUNNER_TEMP/tg.cfg" -o "$RUNNER_TEMP/tg.json" -w '%{http_code}' \
            --data-urlencode "chat_id=$chat" --data-urlencode "text=$text" \
            --data-urlencode "disable_web_page_preview=true" 2> "$RUNNER_TEMP/tg.err") || code=000
          rm -f "$RUNNER_TEMP/tg.cfg"
          if [ "$code" = 200 ]; then
            echo "Сообщение в Telegram отправлено."
            exit 0
          fi
          reason=$(jq -r '.description // empty' "$RUNNER_TEMP/tg.json" 2>/dev/null || true)
          case "$code:$reason" in
            000:*) reason="нет связи с api.telegram.org ($(head -c 200 "$RUNNER_TEMP/tg.err" | sed "s/$token/***/g"))" ;;
            401:*|404:*) reason="Telegram не принял токен ($reason) — проверьте TELEGRAM_BOT_TOKEN" ;;
            400:*chat\ not\ found*) reason="чат не найден ($reason) — проверьте TELEGRAM_CHAT_ID и что вы нажали «Старт» у бота" ;;
            403:*) reason="бот не может писать в этот чат ($reason) — нажмите «Старт» у бота или добавьте его в группу" ;;
            *) reason="HTTP $code ${reason:-без описания}" ;;
          esac
          echo "::warning::Telegram не принял сообщение: $reason"
