# JoyRest Games на сервере: Caddy (HTTPS) → приложение → PostgreSQL.
# Запускается командой `joyrest` (deploy/bin/joyrest) из папки текущего релиза основного
# окружения. Переменные: /srv/joyrest/secrets.env (секреты, в том числе бот заявок сайта),
# /srv/joyrest/runtime.env (образы: APP_IMAGE — основное окружение, APP_TEST_IMAGE — тестовое;
# пишет joyrest) и /srv/joyrest/settings.env (настройки, например SITE_INDEXING).
# Caddyfile и заглушка лежат в /srv/joyrest/caddy/etc (копирует joyrest из релиза), там же
# auth/ — хэш пароля test.joy-rest.ru (пишет `joyrest site-password`, релиз его не трогает), чтобы
# выкладка не пересоздавала caddy: новый Caddyfile применяется через `caddy reload`.
# Наружу открыт только Caddy: 80, 443 и 443/udp (HTTP/3). У app и postgres портов нет,
# база — во внутренней сети без выхода в интернет. Docker обходит ufw, поэтому
# здесь не должно появиться других `ports:`.
name: joyrest

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  caddy:
    image: ghcr.io/joonde/joyrest-mirror/caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      ACME_EMAIL: ${ADMIN_EMAIL}
    volumes:
      - /srv/joyrest/caddy/etc:/etc/caddy:ro
      - /srv/joyrest/caddy/data:/data
      - /srv/joyrest/caddy/config:/config
    networks: [web]
    mem_limit: 128m
    logging: *logging

  postgres:
    image: ghcr.io/joonde/joyrest-mirror/postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: joyrest
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: joyrest_prod
    # Одна PostgreSQL на оба окружения: базы joyrest_prod и joyrest_test (создаёт joyrest).
    # Настройки под 2 ГБ памяти на весь сервер.
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=384MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=40
    volumes:
      - /srv/joyrest/postgres:/var/lib/postgresql/data
    shm_size: 128m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U joyrest -d joyrest_prod"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [db]
    mem_limit: 512m
    logging: *logging

  app-prod:
    image: ${APP_IMAGE}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://joyrest:${POSTGRES_PASSWORD}@postgres:5432/joyrest_prod
      PUBLIC_DIR: /app/public
      NODE_OPTIONS: --max-old-space-size=256
      # Сайт агентства (joy-rest.ru). По умолчанию ВЫКЛЮЧЕН: заглушка «скоро», /api/lead — 404.
      # Включает только владелец: sudo joyrest site on (settings.env). Индексация — тоже
      # settings.env (sudo joyrest site-indexing on|off, только при site on). Бот заявок —
      # secrets.env (sudo joyrest lead-bot). Значения по умолчанию здесь — только off
      # (проверяет server/src/siteSwitch.test.ts).
      SITE_HOSTS: joy-rest.ru
      SITE_ENABLED: ${SITE_ENABLED:-off}
      SITE_INDEXING: ${SITE_INDEXING:-off}
      LEAD_TELEGRAM_TOKEN: ${LEAD_TELEGRAM_TOKEN:-}
      LEAD_TELEGRAM_CHAT_ID: ${LEAD_TELEGRAM_CHAT_ID:-}
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks: [web, db]
    mem_limit: 384m
    logging: *logging

  # Тестовое окружение test.games.joy-rest.ru: своя база, меньше памяти, чтобы проверки
  # и нагрузочный тест не задели основную версию.
  app-test:
    image: ${APP_TEST_IMAGE}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://joyrest:${POSTGRES_PASSWORD}@postgres:5432/joyrest_test
      PUBLIC_DIR: /app/public
      NODE_OPTIONS: --max-old-space-size=160
      # Тестовый сайт test.joy-rest.ru: сайт всегда, закрыт паролем (Caddy, sudo joyrest
      # site-password) и от поисковиков; заявки — в тот же чат с пометкой.
      SITE_HOSTS: test.joy-rest.ru
      SITE_ENABLED: "on"
      SITE_INDEXING: "off"
      LEAD_LABEL: "🧪 ТЕСТ (test.joy-rest.ru)"
      LEAD_TELEGRAM_TOKEN: ${LEAD_TELEGRAM_TOKEN:-}
      LEAD_TELEGRAM_CHAT_ID: ${LEAD_TELEGRAM_CHAT_ID:-}
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks: [web, db]
    mem_limit: 256m
    logging: *logging

networks:
  web: {}
  db:
    internal: true
