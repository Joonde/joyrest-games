# Картинки карточного стола, «Олимпа» и телешоу: скачивает файлы из public/cards/art/manifest.json,
# public/olymp/art/manifest.json и public/shows/art/manifest.json в репозиторий,
# чтобы они хранились в GitHub, попадали в образ и на сервер (и в его резервные копии).
# Ссылки Figma AI живут 7 дней, поэтому запуск — сразу при изменении manifest в ветке
# claude/* (~1 минута) и кнопкой Run workflow. Уже скачанные файлы не перекачиваются.
name: Картинки карт

on:
  push:
    branches: ["claude/**"]
    paths: [public/cards/art/manifest.json, public/olymp/art/manifest.json, public/shows/art/manifest.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: card-art-${{ github.ref }}

jobs:
  fetch:
    name: Скачать картинки
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Скачиваю новые файлы
        run: |
          set -euo pipefail
          added=0
          for dir in public/cards/art public/olymp/art public/shows/art; do
            [ -f "$dir/manifest.json" ] || continue
            while IFS=$'\t' read -r file url; do
              case "$file" in (*/*|.*|"") echo "Плохое имя файла: $file"; exit 1;; esac
              if [ -s "$dir/$file" ]; then echo "Уже есть: $dir/$file"; continue; fi
              curl -fsSL --retry 3 --max-time 60 -o "$dir/$file.tmp" "$url"
              type=$(file -b --mime-type "$dir/$file.tmp")
              case "$type" in (image/png|image/jpeg|image/webp) ;; (*) echo "Не картинка ($type): $file"; rm -f "$dir/$file.tmp"; exit 1;; esac
              mv "$dir/$file.tmp" "$dir/$file"; echo "Скачан: $dir/$file ($type, $(stat -c %s "$dir/$file") байт)"; added=$((added+1))
            done < <(jq -r '.files[] | [.file, .url] | @tsv' "$dir/manifest.json")
          done
          echo "ADDED=$added" >> "$GITHUB_ENV"
      - name: Сохраняю в ветку
        if: env.ADDED != '0'
        run: |
          git config user.name "joyrest-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/cards/art public/olymp/art public/shows/art
          git commit -m "Картинки: скачано $ADDED [no-test]"
          git push
