# Старый адрес joyrest-games.netlify.app (этап 9 переезда): платформа живёт на своём сервере
# games.joy-rest.ru, поэтому любой адрес Netlify ведёт туда же с тем же путём — старые ссылки
# и QR (/play/…, /results/…, /studio) продолжают работать. 302, а не 301: браузеры не запоминают
# перенаправление навсегда (301 — вместе с удалением Firebase, этап 10).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/*"
  to = "https://games.joy-rest.ru/:splat"
  status = 302
  force = true
