# JoyRest Games на сервере: Caddy (HTTPS) → приложение → PostgreSQL.
# Запускается командой `joyrest` (deploy/bin/joyrest) из папки текущего релиза:
#   переменные — /srv/joyrest/secrets.env (секреты) и release.env (версия образа).
# Наружу открыт только Caddy: 80, 443 и 443/udp (HTTP/3). У app и postgres портов нет,
# база — во внутренней сети без выхода в интернет. Docker обходит ufw, поэтому
# здесь не должно появиться других `ports:`.
name: joyrest

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  caddy:
    image: ghcr.io/joonde/joyrest-mirror/caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      ACME_EMAIL: ${ADMIN_EMAIL}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/soon:/srv/soon:ro
      - /srv/joyrest/caddy/data:/data
      - /srv/joyrest/caddy/config:/config
    networks: [web]
    mem_limit: 128m
    logging: *logging

  postgres:
    image: ghcr.io/joonde/joyrest-mirror/postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: joyrest
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: joyrest_prod
    # Настройки под 2 ГБ памяти на весь сервер.
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=384MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=40
    volumes:
      - /srv/joyrest/postgres:/var/lib/postgresql/data
    shm_size: 128m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U joyrest -d joyrest_prod"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [db]
    mem_limit: 512m
    logging: *logging

  app-prod:
    image: ${APP_IMAGE}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://joyrest:${POSTGRES_PASSWORD}@postgres:5432/joyrest_prod
      PUBLIC_DIR: /app/public
      NODE_OPTIONS: --max-old-space-size=256
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks: [web, db]
    mem_limit: 384m
    logging: *logging

networks:
  web: {}
  db:
    internal: true
