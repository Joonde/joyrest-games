.cr span{font-size:.8em;margin-top:0}
.cr.b{bottom:calc(var(--w)*.08);right:calc(var(--w)*.09)}

.medal{width:calc(var(--w)*.5);height:calc(var(--w)*.5);background:radial-gradient(circle at 40% 35%,#6E1F31,#3E0E19);border:1px solid #E9CF8A;box-shadow:0 0 0 calc(var(--w)*.03) rgba(62,14,25,.9),0 0 0 calc(var(--w)*.04) rgba(233,207,138,.6);color:#E9CF8A;font-size:calc(var(--w)*.14)}
.medal::after{content:"";position:absolute;inset:-22%;border-radius:50%;border:1px dashed rgba(233,207,138,.55);animation:spin 20s linear infinite}

.tex{position:absolute;inset:0;border-radius:inherit;background-image:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1.2px);background-size:5px 5px;pointer-events:none}
.light{position:absolute;inset:0;border-radius:inherit;background:radial-gradient(ellipse at 50% 28%,rgba(255,236,190,.22) 0%,transparent 55%);animation:breathe 7s ease-in-out infinite;pointer-events:none}
