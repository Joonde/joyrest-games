# Картинки карточного стола, «Олимпа», телешоу и фигурок «Танцев на поле»: скачивает файлы из public/cards/art/manifest.json,
# public/olymp/art/manifest.json, public/shows/art/manifest.json и public/stage/art/manifest.json в репозиторий,
# чтобы они хранились в GitHub, попадали в образ и на сервер (и в его резервные копии).
# Ссылки Figma AI живут 7 дней, поэтому запуск — сразу при изменении manifest в ветке
# claude/* (~1 минута) и кнопкой Run workflow. Уже скачанные файлы не перекачиваются.
name: Картинки карт

on:
  push:
    branches: ["claude/**"]
    paths: [public/cards/art/manifest.json, public/olymp/art/manifest.json, public/shows/art/manifest.json, public/stage/art/manifest.json, public/spy/art/manifest.json, public/dance/art/manifest.json, docs/site-extras/art/manifest.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: card-art-${{ github.ref }}

jobs:
  fetch:
    name: Скачать картинки
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Скачиваю новые файлы
        run: |
          set -euo pipefail
          added=0
          for dir in public/cards/art public/olymp/art public/shows/art public/stage/art public/spy/art public/dance/art docs/site-extras/art; do
            [ -f "$dir/manifest.json" ] || continue
            while IFS=$'\t' read -r file url; do
              case "$file" in (*/*|.*|"") echo "Плохое имя файла: $file"; exit 1;; esac
              if [ -s "$dir/$file" ]; then echo "Уже есть: $dir/$file"; continue; fi
              curl -fsSL --retry 3 --max-time 60 -o "$dir/$file.tmp" "$url"
              type=$(file -b --mime-type "$dir/$file.tmp")
              case "$type" in (image/png|image/jpeg|image/webp) ;; (*) echo "Не картинка ($type): $file"; rm -f "$dir/$file.tmp"; exit 1;; esac
              mv "$dir/$file.tmp" "$dir/$file"; echo "Скачан: $dir/$file ($type, $(stat -c %s "$dir/$file") байт)"; added=$((added+1))
            done < <(jq -r '.files[] | [.file, .url] | @tsv' "$dir/manifest.json")
          done
          echo "ADDED=$added" >> "$GITHUB_ENV"
      - name: Лёгкие WebP для «Шпиона», «Батла» и обложек сайта
        if: env.ADDED != '0'
        run: |
          pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          for folder in ("public/spy/art", "public/dance/art"):
              src = Path(folder); out = src / "web"; out.mkdir(exist_ok=True)
              for p in sorted(src.glob("*.png")):
                  t = out / (p.stem + ".webp")
                  if t.exists(): continue
                  im = Image.open(p).convert("RGB")
                  wide = im.width > im.height
                  im.thumbnail((1920, 1080) if wide else (720, 960))
                  im.save(t, "WEBP", quality=78 if wide else 80, method=6)
                  print("WebP:", t, t.stat().st_size)
          # Обложки игр сайта: оригиналы — docs/site-extras/art, на сайт — site/img/cover-*.webp (1280×720)
          for p in sorted(Path("docs/site-extras/art").glob("cover-*.png")):
              t = Path("site/img") / (p.stem + ".webp")
              if t.exists(): continue
              im = Image.open(p).convert("RGB")
              w, h = im.size; th = round(w * 9 / 16)
              if th < h: im = im.crop((0, (h - th) // 2, w, (h - th) // 2 + th))
              im = im.resize((1280, 720), Image.LANCZOS)
              im.save(t, "WEBP", quality=80, method=6)
              print("WebP:", t, t.stat().st_size)
          PY
      - name: Сохраняю в ветку
        if: env.ADDED != '0'
        run: |
          git config user.name "joyrest-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/cards/art public/olymp/art public/shows/art public/stage/art public/spy/art public/dance/art docs/site-extras/art site/img
          git commit -m "Картинки: скачано $ADDED [no-test]"
          git push
