# Проверки и сборка образа. Запускается только на push (main и ветки claude/*):
# проверки PR идут по тому же коммиту, повторный прогон на pull_request не нужен —
# так экономим минуты Actions (закрытый репозиторий: 2000 минут в месяц).
name: Сборка

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/joonde/joyrest-app

jobs:
  check:
    name: Тесты и проверки
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Проверка типов
        run: npx tsc -b
      - name: Тесты
        run: npm test
      - name: Сборка сайта и сервера
        run: npm run build && npm run build:server
      - name: Проверка скриптов сервера (shellcheck)
        run: shellcheck --severity=warning deploy/bin/* deploy/setup/*.sh
      - name: Проверка docker-compose
        run: |
          printf 'APP_VERSION=ci\nAPP_IMAGE=%s:ci\n' "$IMAGE" > deploy/release.env
          printf 'ADMIN_EMAIL=ci@example.com\nPOSTGRES_PASSWORD=ci\n' > /tmp/secrets.env
          docker compose -f deploy/compose.yml --env-file /tmp/secrets.env --env-file deploy/release.env config -q
          # Наружу публикует порты только caddy (Docker обходит ufw).
          published=$(docker compose -f deploy/compose.yml --env-file /tmp/secrets.env --env-file deploy/release.env config --format json \
            | jq -r '.services | to_entries[] | select(.value.ports != null and (.value.ports | length) > 0) | .key')
          echo "Сервисы с открытыми портами: $published"
          [ "$published" = "caddy" ]

  image:
    name: Образ в GHCR
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Теги
        id: tags
        run: |
          branch="${GITHUB_REF_NAME//\//-}"
          echo "list=$IMAGE:sha-$GITHUB_SHA,$IMAGE:${branch,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          build-args: |
            APP_VERSION=${{ github.sha }}
            APP_IMAGE=${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
