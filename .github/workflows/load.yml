# Нагрузочная проверка (этап 7, CLAUDE.md, раздел 9): виртуальные гости проходят демо-квиз
# на test.games.joy-rest.ru. Только вручную (Run workflow) или коммитом с [load] в ветке
# claude/* — минуты Actions на неё тратятся, только когда её просят (~5 минут за прогон).
# Ведущий для нагрузки — load@joy-rest.ru на тестовом адресе, пароль — секрет LOAD_HOST_PASSWORD.
name: Нагрузка

on:
  workflow_dispatch:
    inputs:
      guests:
        description: "Сколько гостей (до 1000; пусто — 500 для квиза, 200 для быстрого канала)"
        default: ""
      teams:
        description: "Режим команд (по 10 телефонов)"
        type: boolean
        default: false
      events:
        description: "Сколько мероприятий одновременно (гостей — на каждое)"
        default: "1"
      mode:
        description: "Что проверяем: quiz — демо-квиз, room — быстрый канал (комната room-check; на test — до 200 гостей)"
        type: choice
        options: ["quiz", "room"]
        default: "quiz"
      seconds:
        description: "Быстрый канал: сколько секунд боты жмут"
        default: "60"
  push:
    branches: ["claude/**"]

concurrency:
  group: load
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  load:
    name: Нагрузка на test
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[load]') || contains(github.event.head_commit.message, '[load-room]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Гости играют
        run: npx tsx scripts/load.ts
        env:
          LOAD_BASE: https://test.games.joy-rest.ru
          LOAD_HOST_EMAIL: load@joy-rest.ru
          LOAD_HOST_PASSWORD: ${{ secrets.LOAD_HOST_PASSWORD }}
          # Быстрый канал на test — 200 гостей (app-test ограничен памятью), квиз — 500.
          GUESTS: ${{ inputs.guests || ((inputs.mode == 'room' || contains(github.event.head_commit.message, '[load-room]')) && '200') || '500' }}
          TEAMS: ${{ inputs.teams && '1' || '0' }}
          EVENTS: ${{ inputs.events || '1' }}
          # Коммит с [load-room] — быстрый канал на 200 гостях, иначе — как выбрано (по умолчанию квиз).
          MODE: ${{ inputs.mode || (contains(github.event.head_commit.message, '[load-room]') && 'room') || 'quiz' }}
          ROOM_SECONDS: ${{ inputs.seconds || '60' }}
