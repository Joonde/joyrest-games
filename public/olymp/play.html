<title>Олимп — Вечная зима</title>
<meta name="robots" content="noindex,nofollow">
<style>
:root{--bg:#0B0C0F;--panel:#16151A;--panel2:#1E1C22;--line:rgba(227,198,140,.22);--ink:#FBF6F1;--soft:#B5ABA2;--gold:#E3C68C;--gold2:#F3DFAE;--rose:#C49E96;--green:#A3C2AA;--red:#E3AA9C;--ice:#9EC3D6;--violet:#B3AADD;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 Jost,system-ui,sans-serif;font-variant-numeric:lining-nums;-webkit-tap-highlight-color:transparent}
.serif{font-family:'Cormorant Garamond',Georgia,serif;font-weight:700}
button{font:inherit;color:inherit}
.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:0 16px calc(84px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:linear-gradient(var(--bg) 70%,transparent);padding:12px 0 10px;display:flex;align-items:center;gap:10px}
header.top .logo{font:700 22px 'Cormorant Garamond',serif;color:var(--gold2);letter-spacing:.04em}
header.top .sub{color:var(--soft);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
header.top .gold{white-space:nowrap;font-weight:600;color:var(--gold2);font-size:14px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(3,1fr);background:rgba(11,12,15,.96);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs button{min-height:58px;background:none;border:0;color:var(--soft);font-weight:500;font-size:13px;position:relative;cursor:pointer}
nav.tabs button[aria-current="true"]{color:var(--gold2)}
nav.tabs button[aria-current="true"]::before{content:'';position:absolute;top:0;left:28%;right:28%;height:2px;background:linear-gradient(90deg,#E3C68C,#A3C2AA);border-radius:2px}
nav.tabs .badge{position:absolute;top:8px;left:calc(50% + 18px);min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#221E1B;font:700 11px/18px Jost,sans-serif;padding:0 5px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px}
.stack{display:flex;flex-direction:column;gap:14px}
.btn{min-height:52px;border-radius:14px;border:0;background:var(--rose);color:#221E1B;font-weight:600;font-size:16px;padding:0 18px;cursor:pointer;width:100%}
.btn:disabled{opacity:.45;cursor:default}
.btn2{min-height:48px;border-radius:14px;border:1.5px solid var(--gold);background:transparent;color:var(--ink);font-weight:600;padding:0 16px;cursor:pointer;width:100%}
.quiet{background:none;border:0;color:#CFE3EE;text-decoration:underline;text-underline-offset:3px;min-height:44px;cursor:pointer;padding:0 4px;font-weight:600;font-size:14px}
:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
.place{display:flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ice)}
h1.t{margin:0;font:700 32px/1.1 'Cormorant Garamond',serif;text-wrap:balance;color:var(--gold2)}
h2.t{margin:0;font:700 24px/1.15 'Cormorant Garamond',serif;text-wrap:balance}
.lead{font:600 19px/1.45 'Cormorant Garamond',serif;color:#ECE4DA;text-wrap:pretty;margin:0}
.muted{color:var(--soft);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12.5px;font-weight:600;border-radius:999px;padding:4px 10px;background:rgba(251,246,241,.07);border:1px solid rgba(251,246,241,.14);white-space:nowrap}
.chip.wrap{white-space:normal;border-radius:12px;line-height:1.35}
.chip.good{background:rgba(163,194,170,.16);border-color:rgba(163,194,170,.4);color:#CFE6D4}
.chip.bad{background:rgba(227,170,156,.14);border-color:rgba(227,170,156,.4);color:#F0C2B6}
.chip.gold{background:rgba(227,198,140,.14);border-color:rgba(227,198,140,.45);color:var(--gold2)}
/* сцена и погода */
.scene{position:relative;overflow:hidden}
.weather{position:absolute;inset:0;pointer-events:none;overflow:hidden;border-radius:inherit}
.weather i{position:absolute;top:-10px;width:4px;height:4px;border-radius:50%;background:#fff;opacity:.7;animation:fall linear infinite}
.weather.embers i{background:#F3A86B;top:auto;bottom:-10px;animation-name:rise;width:3px;height:3px}
.weather.mist i{width:140px;height:40px;border-radius:50%;background:radial-gradient(rgba(158,195,214,.18),transparent 70%);animation-name:drift;top:auto}
@keyframes fall{to{transform:translate(30px,520px)}}
@keyframes rise{to{transform:translate(-20px,-420px);opacity:0}}
@keyframes drift{from{transform:translateX(-160px)}to{transform:translateX(560px)}}
@media (prefers-reduced-motion:reduce){.weather{display:none}}
.scene>*:not(.weather){position:relative}
/* выбор богов */
.godgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.gcard{text-align:left;border-radius:16px;border:1.5px solid rgba(251,246,241,.14);background:var(--panel2);padding:12px;display:flex;flex-direction:column;gap:6px;cursor:pointer;min-width:0}
.gcard[aria-pressed="true"]{border-color:var(--gold2);background:rgba(227,198,140,.1)}
.gcard b{font:700 20px 'Cormorant Garamond',serif}
.gcard small{color:var(--soft);font-size:12px;line-height:1.35}
.emb{width:40px;height:40px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;font:700 18px 'Cormorant Garamond',serif;color:#221E1B;background:radial-gradient(circle at 35% 30%,#fff8,transparent 55%),var(--ec);box-shadow:0 0 0 2px rgba(0,0,0,.35),0 0 14px color-mix(in srgb,var(--ec) 45%,transparent)}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.row>div{min-width:0;flex:1}
/* кубик */
.die{display:flex;align-items:center;gap:16px}
.d100{width:92px;height:92px;flex-shrink:0;border-radius:22px;display:grid;place-items:center;font:700 44px 'Cormorant Garamond',serif;color:#221E1B;background:radial-gradient(circle at 35% 28%,#FFF3D2,#E3C68C 45%,#9C7A3C);box-shadow:0 10px 24px rgba(0,0,0,.5),inset 0 -6px 12px rgba(0,0,0,.25);font-variant-numeric:tabular-nums}
.d100.spin{animation:wob .12s linear infinite}
@keyframes wob{50%{transform:rotate(8deg) scale(1.04)}}
.outc{font:700 26px 'Cormorant Garamond',serif}
.o-crit{color:var(--gold2)}.o-good{color:var(--green)}.o-mid{color:var(--ice)}.o-bad{color:var(--red)}.o-fail{color:#E87F6E}
/* бой */
.foe{display:flex;flex-direction:column;gap:8px}
.bar{height:10px;border-radius:6px;background:rgba(251,246,241,.1);overflow:hidden;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#6E9277,#A3C2AA);transition:width .5s}
.bar.foe i{background:linear-gradient(90deg,#7a9fb3,#CFE3EE)}
.bar.low i{background:linear-gradient(90deg,#B9786A,#E3AA9C)}
.bar.sh{height:4px}.bar.sh i{background:#9EC3D6}
.bar.ch{height:4px}.bar.ch i{background:linear-gradient(90deg,#C9A15F,#F3DFAE)}
.hpline{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--soft)}
.hpline b{color:var(--ink);font-variant-numeric:tabular-nums}
.queue{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.queue span{flex:0 0 auto;font-size:12px;font-weight:600;border-radius:999px;padding:5px 10px;background:rgba(251,246,241,.06);border:1px solid rgba(251,246,241,.12)}
.queue span.now{background:var(--gold);color:#221E1B;border-color:var(--gold)}
.queue span.foeq{color:#CFE3EE}
.party{display:flex;flex-direction:column;gap:8px}
.pm{border-radius:14px;padding:10px 12px;background:var(--panel2);border:1.5px solid transparent;display:flex;gap:10px;align-items:center}
.pm.cur{border-color:var(--gold2)}
.pm.down{opacity:.45}
.pm.tgt{cursor:pointer;border-color:var(--green)}
.pm .nm{display:flex;justify-content:space-between;gap:6px;font-weight:600;font-size:14px}
.pm .nm small{color:var(--soft);font-weight:400;white-space:nowrap}
.abil{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ab{text-align:left;border-radius:14px;border:1.5px solid rgba(251,246,241,.15);background:rgba(251,246,241,.04);padding:10px 12px;min-height:66px;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}
.ab b{font-size:14px;line-height:1.25}
.ab small{font-size:11.5px;color:var(--soft);line-height:1.3}
.ab.ult{border-color:rgba(227,198,140,.55);background:linear-gradient(150deg,rgba(227,198,140,.18),rgba(227,198,140,.03))}
.ab:disabled{opacity:.38;cursor:default}
.log{display:flex;flex-direction:column;gap:8px}
.ev{display:grid;grid-template-columns:22px 1fr;gap:8px;font-size:13.5px;line-height:1.4;color:#E9E1D8}
.ev .i{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:12px;color:var(--c);background:color-mix(in srgb,var(--c) 18%,transparent)}
.ev b{color:#fff;font-weight:600}
.ev.fresh{animation:in .5s ease-out}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.ev-curse span:last-child{color:#F0C2B6}
.ev-story span:last-child{color:#D9D2C9;font-style:italic}
.filters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.filters button{flex:0 0 auto;min-height:38px;padding:0 14px;border-radius:999px;border:1px solid rgba(158,195,214,.3);background:none;color:#CFE3EE;font-size:13px;font-weight:500;cursor:pointer}
.filters button[aria-pressed="true"]{background:#CFE3EE;color:#221E1B}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#2A2622;border:1px solid var(--line);color:var(--ink);padding:10px 16px;border-radius:12px;font-size:14px;z-index:9;max-width:calc(100% - 32px);text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.res{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.res span{font-size:11.5px;text-align:center;border-radius:8px;padding:4px 2px;background:rgba(251,246,241,.05)}
.res span.w{color:#CFE6D4;background:rgba(163,194,170,.14)}.res span.s{color:#F0C2B6;background:rgba(227,170,156,.12)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.stats div{background:rgba(251,246,241,.05);border-radius:10px;padding:6px 8px;font-size:12px;color:var(--soft)}
.stats b{display:block;color:var(--ink);font-size:16px}
.end{font:700 40px/1.05 'Cormorant Garamond',serif;color:var(--gold2);text-align:center;text-wrap:balance}
</style>

  $('#main').innerHTML='<div class="card scene">'+weather('snow')+'<div class="place">Пробная история · 18+</div><h1 class="t">Вечная зима</h1><p class="lead">'+esc(ST.blurb)+'</p><p class="muted">Выберите богов отряда — от 2 до 6. Один телефон, ходите по очереди: этот прототип проходит историю целиком на правилах настоящей игры.</p></div>'+
    '<div class="godgrid">'+O.GODS.map(g=>'<button class="gcard" data-g="'+g.id+'" aria-pressed="'+G.pick.includes(g.id)+'"><span class="row">'+emb(g)+'<span style="min-width:0"><b>'+g.name+'</b><br><small>'+O.ROLES[g.role].name+' · '+O.ELEMENT_NAMES[g.element]+'</small></span></span><small>'+esc(O.ROLES[g.role].hint)+'</small></button>').join('')+'</div>'+
    '<button class="btn" id="go"'+(n>=2&&n<=6?'':' disabled')+'>'+(n<2?'Выберите хотя бы двух богов':n>6?'Не больше шести':'Начать — '+n+' '+(n<5?'бога':'богов'))+'</button>';
  document.querySelectorAll('.gcard').forEach(b=>b.onclick=()=>{ const id=b.dataset.g; G.pick=G.pick.includes(id)?G.pick.filter(x=>x!==id):[...G.pick,id]; renderPick(); });
  $('#go').onclick=()=>{ G.party=G.pick.map((g,i)=>({pid:'p'+i,god:g,xp:0,hp:100,coins:0,effects:[]})); G.phase='scene'; addLog('story','Отряд собран: '+G.party.map(m=>godOf(m).name).join(', '),G.party.map(m=>godOf(m).name)); enterScene(ST.start); };
}
function weather(kind){ if(kind==='none') return ''; let s='<div class="weather '+kind+'">'; const n=kind==='mist'?5:kind==='embers'?16:26; for(let i=0;i<n;i++){ const l=Math.round(Math.random()*100), d=(kind==='mist'?14:5)+Math.random()*(kind==='mist'?10:6), del=-Math.random()*d; s+='<i style="left:'+l+'%;'+(kind==='mist'?'top:'+Math.round(Math.random()*80)+'%;':'')+'animation-duration:'+d.toFixed(1)+'s;animation-delay:'+del.toFixed(1)+'s"></i>'; } return s+'</div>'; }

/* ---------- сцены ---------- */
function enterScene(id){
  const sc=O.sceneOf(ST,id); G.scene=id; G.check=null; G.vote=null;
  if(sc.kind==='branch'){ const nx=O.branchNext(sc,G.flags); addLog('story',sc.title+': '+sc.text); return enterScene(nx); }
  if(sc.kind==='end'){ G.phase='end'; addLog('story','Концовка: «'+sc.title+'»'); }
  else if(sc.kind==='fight'){ G.phase='scene'; }
  else G.phase='scene';
  addLog('story',sc.title+' — '+sc.screen); save(); render();
}
function renderScene(){
  const sc=O.sceneOf(ST,G.scene), pl=O.placeOf(ST,sc.place);
  $('#sub').textContent=pl.name;
  let body='';
  if(sc.kind==='narrate') body='<button class="btn" id="next">Дальше</button>';
  if(sc.kind==='fight') body='<p class="muted">Противник: '+esc(O.foeOf(sc.foe).name)+'</p><button class="btn" id="fight">Начать бой</button>';
  if(sc.kind==='vote'){ const opts=O.visibleOptions(sc,G.flags); body='<p class="muted">Отряд решает большинством — выберите, куда идти:</p>'+opts.map((o,i)=>'<button class="btn2" data-o="'+i+'" style="text-align:left;padding:10px 16px;min-height:60px"><b>'+esc(o.label)+'</b><br><span class="muted">'+esc(o.hint)+'</span></button>').join(''); }
  if(sc.kind==='check') body=renderCheck(sc);
  $('#main').innerHTML='<div class="card scene">'+weather(pl.weather)+'<div class="place">'+esc(pl.name)+'</div><h1 class="t">'+esc(sc.title)+'</h1><p class="lead">'+esc(sc.text)+'</p>'+(sc.kind==='check'?'<div class="chips"><span class="chip gold wrap">'+esc(sc.action)+'</span></div>':'')+'</div><div class="stack">'+body+'</div>';
  const nb=$('#next'); if(nb) nb.onclick=()=>enterScene(sc.next);
  const fb=$('#fight'); if(fb) fb.onclick=()=>startFight(sc);
  document.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{ const o=O.visibleOptions(sc,G.flags)[+b.dataset.o]; addLog('vote','Голосование «'+sc.title+'»: «'+o.label+'»'); enterScene(o.next); });
  if(sc.kind==='check') bindCheck(sc);
}
function renderCheck(sc){
  const c=G.check||{who:G.party[0].pid};
  if(!c.done){
    const m=member(c.who), stat=statWith(m,sc.stat), mod=rollMod(m), thr=O.threshold(stat);
    return '<div class="card"><b>Кто бросает?</b><div class="party">'+G.party.map(p=>{const g=godOf(p);return '<button class="pm'+(p.pid===c.who?' cur':'')+'" data-who="'+p.pid+'" style="text-align:left;cursor:pointer">'+emb(g,34)+'<div><div class="nm">'+g.name+'<small>'+O.STAT_NAMES[sc.stat]+' '+statWith(p,sc.stat)+'</small></div></div></button>';}).join('')+'</div>'+
      '<p class="muted">Порог '+thr+' (100 − '+O.STAT_NAMES[sc.stat]+'), «хорошо» — от '+(thr+20)+'. 96–100 — всегда крит. удача, 1–5 — всегда крит. неудача.'+(mod?' Эффекты: '+(mod>0?'+':'−')+Math.abs(mod)+' к броску.':'')+'</p>'+
      '<div class="die"><span class="d100" id="die">?</span><button class="btn" id="roll">Бросить d100</button></div></div>';
  }
  const br=sc.outcomes[c.outcome];
  return '<div class="card"><div class="die"><span class="d100">'+c.roll+'</span><div><div class="outc o-'+c.outcome+'">'+O.OUTCOME_NAMES[c.outcome]+'</div><div class="muted">'+esc(godOf(member(c.who)).name)+' · '+O.STAT_NAMES[sc.stat]+(c.mod?' · '+(c.mod>0?'+':'−')+Math.abs(c.mod)+' от эффектов':'')+'</div></div></div><p class="lead">'+esc(br.text)+'</p><div class="chips">'+c.chips.map(x=>'<span class="chip '+x[1]+'">'+esc(x[0])+'</span>').join('')+'</div></div><button class="btn" id="next2">Дальше</button>';
}
function bindCheck(sc){
  const c=G.check||(G.check={who:G.party[0].pid});
  document.querySelectorAll('[data-who]').forEach(b=>b.onclick=()=>{ c.who=b.dataset.who; renderScene(); });
  const rb=$('#roll'); if(rb) rb.onclick=()=>{ if(busy) return; busy=true; rb.disabled=true; const die=$('#die'); die.classList.add('spin'); let k=0; const iv=setInterval(()=>{ die.textContent=d100(); if(++k>=(reduce?1:9)){ clearInterval(iv); die.classList.remove('spin'); busy=false; resolveCheck(sc); } },90); };
  const nb=$('#next2'); if(nb) nb.onclick=()=>{ const br=sc.outcomes[c.outcome]; enterScene(br.next||sc.next); };
}
function resolveCheck(sc){
  const c=G.check, m=member(c.who), g=godOf(m); const roll=d100(); const mod=rollMod(m);
  const outcome=O.outcomeOf(roll,statWith(m,sc.stat),mod); const br=sc.outcomes[outcome]; const chips=[];
  const xp=br.xp!=null?br.xp:O.OUTCOME_XP[outcome]; if(xp){ giveXp(m,xp); chips.push(['+'+xp+' опыта '+g.name,'good']); }
  m.effects=m.effects.filter(e=>!e.once);
  if(br.effect){ m.effects.push({...br.effect,left:br.effect.turns,once:br.effect.turns===1}); chips.push(['«'+br.effect.name+'» на '+g.name,'bad']); }
  if(br.flag&&!G.flags.includes(br.flag)){ G.flags.push(br.flag); chips.push(['Сага запомнила','gold']); }
  if(br.hurt){ m.hp=Math.max(1,m.hp-br.hurt); chips.push(['−'+br.hurt+' здоровья '+g.name,'bad']); }
  if(br.coins){ coins(br.coins,chips); }
  Object.assign(c,{done:true,roll,mod,outcome,chips});
  addLog(outcome==='fail'?'curse':'story',g.name+': «'+sc.title+'», бросок '+roll+(mod?(mod>0?' +':' −')+Math.abs(mod):'')+' — '+O.OUTCOME_NAMES[outcome].toLowerCase()+'. '+br.text,[g.name]);
  save(); renderScene();
}
function coins(amount,chips){
  if(amount>0){ const rolls=G.party.map(()=>d100()); const parts=O.splitCoins(amount,rolls); G.party.forEach((m,i)=>m.coins+=parts[i]); addLog('coin','Отряду '+amount+' драхм, делим бросками: '+G.party.map((m,i)=>godOf(m).name+' '+rolls[i]+' → '+parts[i]).join(', '),G.party.map(m=>godOf(m).name)); chips&&chips.push(['+'+amount+' драхм отряду','gold']); }
  else { let left=-amount; G.party.forEach(m=>{ const t=Math.min(m.coins,Math.ceil(left/G.party.length)); m.coins-=t; }); addLog('coin','Отряд заплатил '+(-amount)+' драхм'); chips&&chips.push([amount+' драхм','bad']); }
}

/* ---------- бой ---------- */
function startFight(sc){
  const B=O.startBattle(sc.foe,G.party.map(m=>({pid:m.pid,god:m.god,level:lvl(m).level,hp:Math.max(1,m.hp)})),G.seq);
  // эффекты из сюжета переходят в бой
  for(const f of B.fighters){ const m=member(f.id); if(m) f.effects=m.effects.map(e=>({id:e.id,name:e.name,kind:e.kind,left:e.left||e.turns,roll:e.roll,stats:e.stats,dot:e.dot,speed:e.speed,taken:e.taken,skip:e.skip,from:'сюжет'})); }
  G.party.forEach(m=>m.effects=[]);
  G.battle=B; G.phase='fight'; G.pending=null; G.lastDie=null; syncLog(); save(); render(); setTimeout(startTurn,400);
}
function syncLog(){ const B=G.battle; if(!B) return; const fresh=B.log.filter(e=>e.n>=G.seq).sort((a,b)=>a.n-b.n); for(const e of fresh){ G.log.unshift({...e}); } if(B.seq>G.seq) G.seq=B.seq; }
function startTurn(){
  const B=G.battle; if(!B||B.over) return finishFight();
  const r=O.beginTurn(B); G.battle=r.battle; syncLog();
  if(G.battle.over){ render(); return finishFight(); }
  if(r.skip){ G.battle=O.endTurn(G.battle); render(); return setTimeout(startTurn,reduce?200:900); }
  const actor=G.battle.fighters.find(f=>f.id===G.battle.actor);
  render();
  if(actor.side==='foe'){ busy=true; setTimeout(()=>{ G.battle=O.foeAct(G.battle,d100()); syncLog(); busy=false; afterAction(); },reduce?300:1300); }
}
function afterAction(){ if(G.battle.over){ save(); render(); return finishFight(); } G.battle=O.endTurn(G.battle); save(); render(); setTimeout(startTurn,reduce?150:600); }
function useAbility(abId,targets){
  const B=G.battle; const roll=d100(); busy=true; G.lastDie={roll:'…'}; render();
  setTimeout(()=>{ try{ const res=O.godAct(G.battle,B.actor,abId,targets,roll); G.battle=res.battle; G.lastDie={roll,outcome:res.outcome}; }catch(e){ toast(e.message); busy=false; render(); return; } syncLog(); busy=false; G.pending=null; afterAction(); },reduce?100:700);
}
function finishFight(){
  if(G.battleEnd) return;
  const B=G.battle, sc=O.sceneOf(ST,G.scene), foe=O.foeOf(B.foe);
  const win=B.over==='win'; const lines=[];
  // здоровье переносится в историю
  for(const f of B.fighters){ const m=member(f.id); if(!m) continue; m.hp=f.down?Math.max(1,Math.round(f.hpMax*(win?0.25:0.3))):f.hp; }
  if(win){ const xp=O.battleXp(B); for(const [pid,v] of Object.entries(xp)){ const m=member(pid); giveXp(m,v); lines.push(godOf(m).name+' +'+v+' опыта'); } addLog('coin','Опыт за бой: '+lines.join(', '),G.party.map(m=>godOf(m).name)); coins(foe.coins); }
  else addLog('fight','Отряд отступает. Наград нет',[]);
  G.battleEnd={win,lines,next:win?sc.win:sc.lose,totals:O.battleTotals(B)}; save(); render();
}
function renderFight(){
  const B=G.battle, foeF=B.fighters.find(f=>f.side==='foe'), foe=O.foeOf(B.foe), actor=B.fighters.find(f=>f.id===B.actor);
  $('#sub').textContent='Бой · '+foe.name;
  const intent=O.intentOf(B);
  const res=Object.entries(foe.resist).filter(([k,v])=>v!==100).map(([k,v])=>'<span class="'+(v>100?'w':'s')+'">'+O.ELEMENT_NAMES[k]+' '+v+'%</span>').join('');
  const fx=f=>f.effects.map(e=>'<span class="chip '+(e.kind==='curse'?'bad':'good')+'">'+esc(e.name)+' · '+e.left+'</span>').join('');
  let h='<div class="card foe"><div class="place">'+(foe.boss?'Босс · ':'')+'ранг '+foe.rank+' · '+O.ELEMENT_NAMES[foe.element]+'</div><h2 class="t">'+esc(foe.name)+'</h2>'+
    '<div class="hpline"><span>Здоровье</span><b>'+foeF.hp+' / '+foeF.hpMax+'</b></div><div class="bar foe"><i style="width:'+(foeF.hp/foeF.hpMax*100)+'%"></i></div>'+
    (B.over?'':'<div class="muted">Готовит: <b style="color:#fff">'+esc(intent.name)+'</b> — '+esc(intent.hint)+'</div>')+
    (fx(foeF)?'<div class="chips">'+fx(foeF)+'</div>':'')+'<div class="res">'+res+'</div></div>';
  if(!B.over){ const q=O.turnQueue(B,8); h+='<div class="queue" aria-label="Очередь ходов">'+q.map((id,i)=>{const f=B.fighters.find(x=>x.id===id);return '<span class="'+(i===0?'now':'')+(f.side==='foe'?' foeq':'')+'">'+esc(f.side==='foe'?'Противник':f.name)+'</span>';}).join('')+'</div>'; }

  const partyHtml='<div class="party">'+B.fighters.filter(f=>f.side==='god').map(f=>{const g=O.godOf(f.ref);const low=f.hp/f.hpMax<.35;const tgt=G.pending&&!f.down;return '<div class="pm'+(f.id===B.actor&&!B.over?' cur':'')+(f.down?' down':'')+(tgt?' tgt':'')+'" data-t="'+f.id+'"'+(tgt?' role="button" tabindex="0"':'')+'>'+emb(g,36)+'<div><div class="nm">'+g.name+' <small>ур. '+f.level+(f.shield?' · щит '+f.shield:'')+'</small></div><div class="hpline"><span>'+(f.down?'без сил':'здоровье')+'</span><b>'+f.hp+' / '+f.hpMax+'</b></div><div class="bar'+(low?' low':'')+'"><i style="width:'+(f.hp/f.hpMax*100)+'%"></i></div><div class="bar ch" style="margin-top:4px" title="заряд ульты"><i style="width:'+f.charge+'%"></i></div>'+(f.effects.length?'<div class="chips" style="margin-top:6px">'+fx(f)+'</div>':'')+'</div></div>';}).join('')+'</div>';
  if(G.battleEnd){ const E=G.battleEnd; h+='<div class="card"><h2 class="t" style="color:'+(E.win?'var(--green)':'var(--red)')+'">'+(E.win?'Победа!':'Поражение')+'</h2>'+(E.win?'<p class="muted">'+esc(E.lines.join(' · '))+'</p><p class="muted">'+foe.coins+' драхм поделены бросками — смотрите журнал.</p>':'<p class="muted">Отряд отступает. Наград нет, история продолжится.</p>')+'<button class="btn" id="after">Дальше</button></div>'; }
  else if(actor&&actor.side==='god'){
    const g=O.godOf(actor.ref);
    h+='<div class="card"><div class="row">'+emb(g,40)+'<div><b style="font-size:17px">Ходит '+g.name+'</b><div class="muted">'+(G.pending?'Коснитесь союзника выше — на кого':'Выберите способность — бросок кубика решит силу')+'</div></div></div>';
    if(G.lastDie&&busy) h+='<div class="die"><span class="d100 spin">'+G.lastDie.roll+'</span></div>';
    else if(G.pending) h+='<button class="btn2" id="cancel">Отмена</button>';
    else h+='<div class="abil">'+O.abilitiesOf(g).map(a=>{const ok=O.canUse(actor,a);const cd=actor.cd[a.id]||0;const tag=a.ult?(actor.ultUsed?'уже использована':'заряд '+actor.charge+'%'):(cd?'ещё '+cd+' '+(cd===1?'ход':'хода'):(a.element?O.ELEMENT_NAMES[a.element]+' · ':'')+kindName(a));return '<button class="ab'+(a.ult?' ult':'')+'" data-a="'+a.id+'"'+(ok?'':' disabled')+'><b>'+esc(a.name)+'</b><small>'+esc(tag)+'</small><small>'+esc(a.text)+'</small></button>';}).join('')+'</div>';
    h+='</div>';
  } else if(actor) h+='<div class="card"><b>Ходит противник…</b><div class="muted">«'+esc(intent.name)+'»</div></div>';
  if(G.pending) h+='<div class="card"><b>На кого?</b>'+partyHtml+'</div>';
  h+='<div class="card"><b>Журнал боя</b><div class="log">'+G.log.filter(e=>e.n>=B.log[B.log.length-1].n).slice(0,4).map((e,i)=>evHtml(e,i===0)).join('')+'</div></div>';
  if(!G.pending) h+='<div class="card"><b>Отряд</b>'+partyHtml+'</div>';
  $('#main').innerHTML=h;
  document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{ if(busy) return; const a=O.abilitiesOf(O.godOf(actor.ref)).find(x=>x.id===b.dataset.a); if(a.target==='ally'){ G.pending=a.id; render(); } else useAbility(a.id,[]); });
  document.querySelectorAll('.pm.tgt').forEach(el=>{ const go=()=>{ const id=G.pending; G.pending=null; useAbility(id,[el.dataset.t]); }; el.onclick=go; el.onkeydown=e=>{ if(e.key==='Enter') go(); }; });
  const cb=$('#cancel'); if(cb) cb.onclick=()=>{ G.pending=null; render(); };
  const ab=$('#after'); if(ab) ab.onclick=()=>{ const nx=G.battleEnd.next; G.battle=null; G.battleEnd=null; enterScene(nx); };
}
function kindName(a){ return {strike:'удар по одному',blast:'удар по всем',heal:a.target==='allies'?'лечение всех':'лечение',shield:a.target==='allies'?'щит всем':'щит союзнику',bless:'благословение',curse:'проклятие'}[a.kind]; }
function evHtml(e,isNew){ const k=KIND[e.k]||KIND.story; return '<div class="ev ev-'+e.k+(isNew?' fresh':'')+'"><span class="i" style="--c:'+k[1]+'">'+k[0]+'</span><span>'+bold(e.x,e.who)+'</span></div>'; }

    '<div class="card"><b>Итоги отряда</b>'+G.party.map(m=>{const g=godOf(m),L=lvl(m);return '<div class="row">'+emb(g,34)+'<div><b>'+g.name+'</b> · '+L.level+'-й уровень · '+m.xp+' опыта · '+m.coins+' драхм</div></div>';}).join('')+'<p class="muted">Флаги Саги: '+(G.flags.length?G.flags.join(', '):'нет')+'. Другие концовки — с другими выборами и бросками.</p></div>'+

function renderParty(){

    '<button class="quiet" id="reset">Начать историю заново</button>';

const LF=[['all','Все'],['fight','Бой'],['curse','Проклятия'],['heal','Помощь'],['coin','Награды'],['story','Сюжет']];
function renderLog(){
  $('#sub').textContent='Журнал · '+G.log.length;
  const ok=e=>G.logF==='all'||e.k===G.logF||(G.logF==='coin'&&e.k==='level')||(G.logF==='story'&&(e.k==='vote'||e.k==='start'));
  $('#main').innerHTML='<div class="filters">'+LF.map(([k,n])=>'<button data-f="'+k+'" aria-pressed="'+(G.logF===k)+'">'+n+'</button>').join('')+'</div><div class="card"><div class="log">'+(G.log.filter(ok).map(e=>evHtml(e,false)).join('')||'<span class="muted">Пока пусто</span>')+'</div></div>';
  document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{ G.logF=b.dataset.f; renderLog(); });
  seenLog=G.log.length;
}
function render(){
  document.querySelectorAll('nav.tabs button').forEach(b=>b.setAttribute('aria-current',String(b.dataset.tab===tab)));
  $('#goldTop').textContent=G.party.length?'◉ '+goldTotal():'';
  if(tab==='party') renderParty(); else if(tab==='log') renderLog();
  else if(G.phase==='pick') renderPick(); else if(G.phase==='fight') renderFight(); else if(G.phase==='end') renderEnd(); else renderScene();
  const nb=G.log.length-seenLog, badge=$('#logBadge'); if(tab!=='log'&&nb>0){ badge.hidden=false; badge.textContent=nb>9?'9+':nb; } else badge.hidden=true;
}
document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>{ tab=b.dataset.tab; window.scrollTo(0,0); render(); });
G=load()||fresh(); if(!G.logF) G.logF='all'; seenLog=G.log.length;
render();
if(G.phase==='fight'&&G.battle&&!G.battleEnd){ if(G.battle.over) finishFight(); else { const a=G.battle.fighters.find(f=>f.id===G.battle.actor); if(a&&a.side==='foe') startTurn(); } }
})();
</script>
